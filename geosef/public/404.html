<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Joe Carroll</title>
    <script>
      var l = window.location;
      // The House Derby moved to ggcderby.com: same page there.
      if (/^\/cup(\/|$)/.test(l.pathname)) {
        l.replace('https://ggcderby.com' + (l.pathname.replace(/^\/cup/, '') || '/') + l.search + l.hash);
      } else
      // SPA redirect: encode the path into the query string so index.html can restore it
      l.replace(
        l.protocol + '//' + l.host + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
