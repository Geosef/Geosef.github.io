<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Restore path encoded by 404.html SPA redirect
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));

      // House Derby (/cup): paint the board's background before the app loads,
      // so the page doesn't flash white ahead of the crest splash. Colors and
      // layout rule mirror src/pages/HouseDerby/display.ts; the page's own
      // styles take over (and remove this) once it mounts.
      (function(l) {
        if (!/^\/cup(\/|$)/.test(l.pathname)) return;
        var tv = new URLSearchParams(l.search).get('tv');
        var bg = tv === null ? '#f8f6ea'
          : tv === 'vertical' || (tv !== 'landscape' && matchMedia('(orientation: portrait)').matches) ? '#1d1f2b'
          : '#3f4463';
        var style = document.createElement('style');
        style.id = 'cup-early-bg';
        style.textContent = 'html,body{background:' + bg + '}';
        document.head.appendChild(style);
      }(window.location));
    </script>
    <!-- Browser-chrome tint (status/address bar), matched to the page surface (--gl-white). -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="GGC golf league standings, scores, and player stats — plus a ski-resort travel coordinator." />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joe Carroll" />
    <meta property="og:title" content="Joe Carroll" />
    <meta property="og:description" content="GGC golf league standings, scores, and player stats — plus a ski-resort travel coordinator." />
    <meta property="og:url" content="https://geosef.io/" />
    <meta property="og:image" content="https://geosef.io/golf/ggc-captains-logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joe Carroll" />
    <meta name="twitter:description" content="GGC golf league standings, scores, and player stats — plus a ski-resort travel coordinator." />
    <meta name="twitter:image" content="https://geosef.io/golf/ggc-captains-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Playfair+Display+SC:wght@400;500;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Joe Carroll</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
